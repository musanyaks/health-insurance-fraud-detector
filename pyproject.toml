[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-insurance-fraud-detector"
version = "0.1.0"
description = "Kenya health-insurance claims fraud detection & intelligence platform (MVP)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "pyarrow>=14.0",
  "scikit-learn>=1.3", "xgboost>=2.0", "shap>=0.44", "joblib>=1.3",
  "fastapi>=0.109", "uvicorn[standard]>=0.27", "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]

[tool.setuptools.packages.find]
include = ["fraud_engine*"]